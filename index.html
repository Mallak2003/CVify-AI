          {o.miss.map(w=><span key={'m'+w} className="px-3 py-1 rounded-full text-sm bg-rose-400/15 text-rose-200 border border-rose-300/30">✗ {w}</span>)}</div></div>);})()}
        {!pro&&<div className="rounded-2xl p-4 text-center" style={{background:'rgba(139,92,246,.12)',border:'1px solid rgba(167,139,250,.35)'}}>
         <div className="font-bold text-amber-300 mb-1">🔒 {t.mLockH}{m.all.length>2?' (+'+(m.all.length-2)+')':''}</div>
         <p className="text-sm text-slate-300 mb-3">{t.mLockP}</p>
         <div className="flex gap-3 justify-center flex-wrap"><BuyBtn cls="cta">{t.up}</BuyBtn></div></div>}
        {pro&&<div><div className="text-sm font-bold mb-2">{t.mTipsH}</div>
         <ul className="space-y-2">{tips.map((x,i)=><li key={i} className="rounded-xl p-3 text-sm bg-emerald-400/10">💡 {x}</li>)}</ul></div>}
       </div>}
      </div>}
    </div>

    <div id="pc" className="lg:sticky" style={{top:'90px'}}>
     <div id="paper" dir={dir}>
      <div style={{borderBottom:'3px solid #0a0a0a',paddingBottom:10}}>
       <div style={{fontSize:26,fontWeight:800,lineHeight:1.2}}>{d.name}</div>
       <div style={{fontSize:14,color:'#3f3f3f',fontWeight:600}}>{d.title}</div>
       <div style={{color:'#555',marginTop:4}}>{[d.email,d.phone,d.city].filter(Boolean).join('  |  ')}</div>
      </div>
      {d.summary&&!H.sum&&<div><div className="pt">{t.pSum}</div><Rich text={d.summary}/></div>}
      {!H.exp&&d.exp.some(e=>e.role||e.company)&&<div><div className="pt">{t.pExp}</div>
       {d.exp.map((e,i)=><div key={i} style={{marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:8,fontWeight:700}}><span>{e.role}{e.company&&` — ${e.company}`}</span><span style={{color:'#666',fontWeight:400,whiteSpace:'nowrap'}}>{e.period}</span></div>
        <Rich text={e.desc}/>
       </div>)}</div>}
      {!H.edu&&d.edu.some(e=>e.degree)&&<div><div className="pt">{t.pEdu}</div>
       {d.edu.map((e,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',gap:8}}><span><b>{e.degree}</b>{e.school&&` — ${e.school}`}</span><span style={{color:'#666'}}>{e.year}</span></div>)}</div>}
      {!H.sk&&skillList.length>0&&<div><div className="pt">{t.pSk}</div>
       <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{skillList.map((s,i)=><span key={i} style={{border:'1px solid #b5b5b5',background:'#f1f1f1',color:'#222',borderRadius:999,padding:'1px 10px'}}>{s}</span>)}</div></div>}
      {C.filter(c=>c.title||c.text).map((c,i)=><div key={i}><div className="pt">{c.title}</div><Rich text={c.text}/></div>)}
      {!pro&&<div style={{marginTop:24,textAlign:'center',color:'#aaa',fontSize:10}}>{t.wm}</div>}
     </div>
     <style>{`.pt{font-weight:800;color:#111;font-size:13px;margin:14px 0 4px;border-bottom:1px solid #bdbdbd;padding-bottom:2px}`}</style>
     <button className="cta w-full mt-4" disabled={busy} onClick={doPrint}>{busy?t.pdfBusy:'⬇ '+t.pdf}</button>
     <p className="text-xs text-slate-400 mt-2 text-center">{pdfMsg||t.pdfNote}</p>
     
    </div>
   </div>
  </section>

  <section id="pricing" className="max-w-4xl mx-auto px-3 pb-16">
   <h2 className="text-center text-2xl sm:text-4xl font-extrabold mb-8">{t.priceH}</h2>
   <div className="grid md:grid-cols-2 gap-5">
    <div className="glass p-6">
     <div className="font-bold text-lg">{t.free}</div>
     <div className="text-4xl font-extrabold my-3">$0</div>
     <ul className="space-y-2 text-sm text-slate-300 mb-6">{t.fF.map((x,i)=><li key={i}>✓ {x}</li>)}</ul>
     <button className="ghost w-full" disabled>{pro?t.free:t.cur}</button>
    </div>
    <div className="glass p-6 relative" style={{borderColor:'rgba(236,72,153,.6)',boxShadow:'0 10px 50px rgba(236,72,153,.25)'}}>
     <span className="absolute -top-3 end-5 text-xs font-bold px-3 py-1 rounded-full" style={{background:'linear-gradient(135deg,#f59e0b,#ec4899)'}}>{t.popular}</span>
     <div className="font-bold text-lg">{t.pro}</div>
     <div className="text-4xl font-extrabold my-3">$5 <span className="text-sm font-normal text-slate-400">{t.mo}</span></div>
     <ul className="space-y-2 text-sm text-slate-200 mb-6">{t.fP.map((x,i)=><li key={i}>✓ {x}</li>)}</ul>
     {pro?<button className="cta w-full" disabled>{t.proOn}</button>:<BuyBtn cls="cta w-full block text-center">{t.up}</BuyBtn>}
    </div>
   </div>
  </section>

  <footer className="text-center text-slate-500 text-sm pb-10">{t.foot}</footer>

  {lic&&<div className="fixed inset-0 z-50 grid place-items-center p-4" style={{background:'rgba(3,4,10,.75)',backdropFilter:'blur(6px)'}} onClick={()=>setLic(false)}>
   <div className="glass p-6 w-full max-w-sm space-y-3" style={{background:'rgba(20,21,38,.95)'}} onClick={e=>e.stopPropagation()}>
    <div className="flex justify-between items-center"><div className="font-extrabold text-lg">⭐ Pro</div><button onClick={()=>setLic(false)} aria-label={t.close} className="text-slate-400 text-xl">✕</button></div>
    {pro?<div className="text-center py-2"><div className="text-4xl mb-2">🎉</div><div className="font-bold text-amber-300">{t.lkOk} ✓</div><p className="text-sm text-slate-300 mt-1">{t.lkOkSub}</p>
      <div className="flex gap-2 justify-center mt-4"><button className="cta" onClick={()=>setLic(false)}>{t.close}</button><button className="ghost" onClick={deact}>{t.lkOff}</button></div></div>
    :<div className="space-y-3">
      {payErr&&<p className="text-sm text-slate-300">{t.payUnavail}</p>}
      <label className="block"><span className="text-xs text-slate-400">{t.lkIn}</span>
       <input dir="ltr" type="password" autoComplete="off" className="inp" value={akey} placeholder="••••••••••" onChange={e=>{setAkey(e.target.value);setAerr(false);}} onKeyDown={e=>{if(e.key==='Enter')activateAdmin();}}/></label>
      {aerr&&<p className="text-sm text-rose-300">{t.lkErr}</p>}
      <button className="cta w-full" onClick={activateAdmin}>{t.lkBtn}</button>
     </div>}
   </div>
  </div>}
 </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
